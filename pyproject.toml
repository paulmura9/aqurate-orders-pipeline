[project]
name = "aqurate-orders-pipeline"
version = "1.0.0"
description = "Ingest, clean, convert and aggregate the orders_raw dataset (Aqurate junior data engineer challenge)"
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.2", "requests>=2.32", "python-dotenv>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
